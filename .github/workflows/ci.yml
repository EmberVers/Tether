# Offline fast gate for the Tether bridge plugin — pure Python stdlib, no UE.
#
# What this catches (all offline):
#   1. Contract test regressions in tools/ (unittest discover).
#   2. Stub drift: any _Stubs.cpp missing/stale vs the headers, or the
#      hand-maintained TARGETS table drifting from the actual
#      `#if !UE_VERSION_OLDER_THAN(5, 7, 0)` blocks in the main .cpp files
#      (a missing registration = 5.4 link error).
#   3. UFUNCTION category drift in the C++ headers (add_categories.py).
#   4. README bilingual drift: README.md and README.zh-CN.md must keep the
#      same heading level sequence (section added/removed/moved in one file
#      must be mirrored in the other).
#   5. Manifest staleness: UFUNCTION sets in the headers vs
#      tether_manifest.json (see the note on that step).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Contract tests (tools/)
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Stub files + TARGETS gate scan
        run: python tools/gen_version_stubs.py --check

      - name: Header category drift
        run: python tools/add_categories.py --check

      - name: README bilingual heading sync
        run: python tools/check_readme_sync.py

      # Manifest staleness gate (hard). The manifest is regenerated against
      # a live editor (python tools/gen_manifest.py) whenever the UFUNCTION
      # surface changes; this offline step cross-checks the headers so a
      # forgotten regen fails the pipeline instead of shipping a stale
      # manifest that preflight rejects with "no such function".
      - name: Manifest staleness gate
        run: python tools/gen_manifest.py --check
